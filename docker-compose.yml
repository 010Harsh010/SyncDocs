services:
  postgres:
    image: sha256:e5a8ef347b9693671faa3f2cfa566c5b16ea1bee6b30bfb69819040969329c17
    container_name: multidoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: multidoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d multidoc"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
